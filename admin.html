<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Ezol</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script></head><body class="p-4 max-w-[500px] mx-auto bg-gray-50">
<div id="login"><h1 class="font-black text-2xl text-center mt-10">Admin Login</h1><input id="pass" type="password" placeholder="admin123" class="w-full border rounded-xl p-4 mt-6"><button onclick="check()" class="w-full bg-black text-white rounded-full py-4 mt-4 font-bold">Login</button></div>
<div id="panel" class="hidden"><h1 class="font-black text-xl">Ezol Admin - <span id="count">0 Users</span></h1><div class="grid grid-cols-3 gap-2 mt-4"><div class="bg-white border rounded-xl p-3 text-center"><p class="text-xs">Users</p><b id="totalUsers">0</b></div><div class="bg-white border rounded-xl p-3 text-center"><p class="text-xs">Recharges Pending</p><b id="pendingRe">0</b></div><div class="bg-white border rounded-xl p-3 text-center"><p class="text-xs">Withdraw Pending</p><b id="pendingW">0</b></div></div><h2 class="font-bold mt-6">All Users - Unlimited</h2><div id="userList" class="space-y-2 mt-2"></div><h2 class="font-bold mt-6">Recharges Pending</h2><div id="reList" class="space-y-2 mt-2"></div><h2 class="font-bold mt-6">Withdrawals Pending</h2><div id="wList" class="space-y-2 mt-2"></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyB7jK6hRzXyQwE8fT9lM0nPqRsUvWxYzAbC",authDomain:"ezol-earn-demo.firebaseapp.com",projectId:"ezol-earn-demo"};let db=null;try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();}catch(e){}
function check(){if(document.getElementById('pass').value==='admin123'){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');load();}else alert('Wrong');}
async function load(){
  const usersSnap=await db.collection('users').get(); document.getElementById('count').innerText=usersSnap.size+' Users'; document.getElementById('totalUsers').innerText=usersSnap.size;
  document.getElementById('userList').innerHTML=usersSnap.docs.map(d=>{const u=d.data();return `<div class="bg-white border rounded-xl p-3 text-xs"><p><b>${u.name}</b> - ${u.phone} - Pass: ${u.pass}</p><p>Balance: ${u.balance} - Code: ${u.code} - Time: ${u.time}</p><button onclick="delUser('${d.id}')" class="bg-red-600 text-white rounded-full px-3 py-1 mt-1">Delete</button></div>`}).join('');
  const reSnap=await db.collection('recharges').where('status','==','Pending').get(); document.getElementById('pendingRe').innerText=reSnap.size; document.getElementById('reList').innerHTML=reSnap.docs.map(d=>{const r=d.data();return `<div class="bg-white border rounded-xl p-3 text-xs"><p><b>${r.name} ${r.phone}</b> - ${r.amount} UGX - ${r.time}</p><button onclick="approveRe('${d.id}','${r.userId}',${r.amount})" class="bg-green-600 text-white rounded-full px-3 py-1">Approve +Add Balance</button></div>`}).join('');
  const wSnap=await db.collection('withdrawals').where('status','==','Pending').get(); document.getElementById('pendingW').innerText=wSnap.size; document.getElementById('wList').innerHTML=wSnap.docs.map(d=>{const w=d.data();return `<div class="bg-white border rounded-xl p-3 text-xs"><p><b>${w.name} ${w.phone}</b> - ${w.amount} UGX Receive ${w.receive} - ${w.time}</p><button onclick="approveW('${d.id}')" class="bg-blue-600 text-white rounded-full px-3 py-1">Mark Paid - Dial *165*1*1#</button></div>`}).join('');
}
async function delUser(id){ if(confirm('Delete user?')){ await db.collection('users').doc(id).delete(); load(); } }
async function approveRe(rid,uid,amt){ await db.collection('users').doc(uid).update({balance:firebase.firestore.FieldValue.increment(amt),totalRecharge:firebase.firestore.FieldValue.increment(amt)}); await db.collection('recharges').doc(rid).update({status:'Approved'}); alert('Approved '+amt); load(); }
async function approveW(id){ await db.collection('withdrawals').doc(id).update({status:'Paid'}); alert('Marked Paid - Now send via MTN manually *165*1*1*phone*amount#'); load(); }
</script></body></html>
