<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ezol Energy - Solar Products</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fb;padding-bottom:80px}
.header{background:#0a7a3b;color:#fff;padding:15px;text-align:center;font-weight:bold;font-size:18px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
.card img{width:100%;height:90px;object-fit:cover;border-radius:8px;background:#eee}
.card h4{margin:8px 0 4px;font-size:14px}
.card p{margin:0;color:#0a7a3b;font-weight:bold}
.card button{width:100%;margin-top:6px;background:#0a7a3b;color:#fff;border:0;padding:8px;border-radius:8px}
.share-box{background:#fff;margin:12px;border-radius:12px;padding:15px;text-align:center}
.share-box button{margin:5px;padding:10px 15px;border:0;border-radius:8px;color:#fff}
.btn-wa{background:#25D366} .btn-fb{background:#1877F2} .btn-copy{background:#333}
/* Floating Buttons */
.fab{position:fixed;right:16px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;z-index:9999;box-shadow:0 4px 10px rgba(0,0,0,0.3);font-size:12px;text-align:center}
.fab-group{bottom:150px;background:#25D366}
.fab-cs{bottom:80px;background:#ff8c00}
/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd}
.bottom-nav div{text-align:center;font-size:12px;color:#666}
.bottom-nav .active{color:#0a7a3b;font-weight:bold}
</style>
</head>
<body>

<div class="header">Ezol Energy - Real Solar Products</div>

<div class="share-box">
<h3>Share & Earn Commission</h3>
<p>Invite friends, earn commission on real sales</p>
<p id="inviteLink" style="background:#eee;padding:8px;border-radius:8px;word-break:break-all">https://ezolenergy.com/?ref=0SA6</p>
<button class="btn-wa" onclick="shareWA()">WhatsApp</button>
<button class="btn-fb" onclick="shareFB()">Facebook</button>
<button class="btn-copy" onclick="copyLink()">Copy Link</button>
</div>

<div class="products" id="productList"></div>

<!-- Floating Buttons -->
<a href="https://wa.me/256795143386" class="fab fab-group">Group</a>
<a href="https://wa.me/256795143386" class="fab fab-cs">CS</a>

<!-- Bottom Nav -->
<div class="bottom-nav">
<div class="active">🏠<br>Home</div>
<div>📦<br>Product</div>
<div>🔗<br>Share</div>
<div>👛<br>Wallet</div>
<div>👤<br>My</div>
</div>

<script>
const products = [
["Solar Bulb 5W","15000"],["Solar Bulb 10W","25000"],["Solar Kit Mini","45000"],["Solar Kit Home","85000"],
["Solar Panel 20W","65000"],["Solar Panel 50W","120000"],["Solar Panel 100W","250000"],["Solar Panel 200W","480000"],
["Battery 20AH","180000"],["Battery 50AH","350000"],["Battery 100AH","650000"],["Inverter 500W","300000"],
["Inverter 1000W","550000"],["Full Home System 1","1200000"],["Full Home System 2","2500000"],["Full Home System 3","3500000"],
["Street Light 60W","400000"],["Street Light 100W","650000"],["Water Pump Solar","1200000"],["Complete Farm System","5000000"]
];

const list = document.getElementById('productList');
products.forEach((p,i)=>{
 list.innerHTML += `<div class="card"><img><h4>Product ${i+1}: ${p[0]}</h4><p>UGX ${p[1]}</p><button>View Details</button></div>`;
});

const invite = document.getElementById('inviteLink').innerText;
function shareWA(){ window.open("https://wa.me/?text="+encodeURIComponent("Check Ezol Solar: "+invite)); }
function shareFB(){ window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(invite)); }
function copyLink(){ navigator.clipboard.writeText(invite); alert("Link copied!"); }
</script>

</body>
</html>
